plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.alaviyar.alavi'
    compileSdk 36

    defaultConfig {
        applicationId 'ir.alaviyar.alavi'
        minSdk 21
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            storeFile file('alaviyar-release.jks')
            storePassword 'alaviyar123'
            keyAlias 'alaviyar'
            keyPassword 'alaviyar123'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
